[package]
name = "oxtools"
version = "0.1.0"
edition = "2021"
description = "Interactive cybersecurity tool browser for Arch Linux with BlackArch support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xhroot/0xtools"
readme = "README.md"
keywords = ["cybersecurity", "blackarch", "archlinux", "tui", "tools"]
categories = ["command-line-utilities"]

[[bin]]
name = "0xtools"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
nucleo = "0.5"
alpm = "5"
alpm-utils = { version = "5", features = ["conf"] }
pacmanconf = "3"
chrono = { version = "0.4", features = ["serde"] }
hashbrown = { version = "0.15", features = ["serde"] }
once_cell = "1"
unicode-width = "0.2"
bincode = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
unwrap-used = "warn"
expect-used = "warn"
panic = "warn"
